<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="playlist.svg" alt="Playlist" id="playlist-img">
        <h2>Feel The Music</h2>
        <img src="music.svg" alt="Music" id="music-img">
    </header>
    <main>  
        <div class="left">
            <div class="song-image">     
            </div>
            <div class="volume-div">
                <div class="volume-img">
                    <img src="volume.svg" alt="Volume">
                </div>
                <input type="range" id="volume-range">
            </div>
        </div>
        <div class="right">
            <div class="details">
                <h3 id="song-name">Bajrangbali Aur Main</h3>
                <h5 id="song-artist">Narci</h5>
            </div>
            <input type="range" id="song-duration">
            <div class="controls">
                <div class="previous">
                        <img src="previous.svg" alt="Previous" id="previous">
                </div>
                <div class="play">
                    <img src="play.svg" alt="Play" id="play">
                </div>
                <div class="next">
                    <img src="next.svg" alt="Next" id="next">
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
